<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gerador de Autounattend</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='1' y='1' width='46' height='46' rx='11' fill='%232b7de9'/%3E%3Cpath d='M11 8h17l8 8v22H11z' fill='white'/%3E%3Cpath d='M17 22l-4 5 4 5M27 22l4 5-4 5' stroke='%232b7de9' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='34' cy='35' r='9' fill='%23185cc4' stroke='white' stroke-width='1.6'/%3E%3Cpath d='M34 28.5l2 4.8 5 .2-4 3.2 1.4 5-4.4-2.9-4.4 2.9 1.4-5-4-3.2 5-.2z' fill='%23ffc83d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef5fd; --panel:#ffffff; --surface:#ffffff; --line:#d6e4f5; --line2:#e6eff9;
  --ink:#16324f; --muted:#5d7690; --blue:#2b7de9; --blue-d:#1a5fc0; --blue-l:#e3effd; --blue-xl:#f3f8fe;
  --pri:#2b7de9; --pri-d:#1a5fc0;
  --ok:#17a673; --warn:#c77700; --warn-bg:#fff6e3; --warn-line:#f0d9a6; --warn-ink:#7a4b00;
  --bad:#d23b3b; --bad-bg:#fdeded; --bad-line:#f0c2c2; --bad-ink:#8a1f1f;
  --hd1:#fafdff; --hd2:#f1f7fe; --head:linear-gradient(100deg,#ffffff 0%,#eaf3ff 60%,#d9ebff 100%);
  --shadow:0 1px 2px rgba(22,50,79,.06),0 4px 14px rgba(43,125,233,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1522; --panel:#122238; --surface:#122238; --line:#27425f; --line2:#1d3550;
  --ink:#e4eefb; --muted:#92abc6; --blue:#4f9dff; --blue-d:#8cc0ff; --blue-l:#17324f; --blue-xl:#0f2236;
  --pri:#2b7de9; --pri-d:#4a93f2;
  --warn:#f0b050; --warn-bg:#33290f; --warn-line:#5a4617; --warn-ink:#f3cf8a;
  --bad:#ff8080; --bad-bg:#3a1a1e; --bad-line:#6a2b31; --bad-ink:#ffb3b3;
  --hd1:#17304d; --hd2:#132a44; --head:linear-gradient(100deg,#10223a 0%,#12294a 60%,#15335c 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--head);border-bottom:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:12px;flex:0 0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo svg{width:42px;height:42px;flex:0 0 auto}
.logo b{display:block;font-size:17px;letter-spacing:.2px}
.logo .sub2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.by{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,#ffe08a,#ffc83d);color:#5a3b00;border-radius:99px;padding:1px 10px 1px 7px;font-weight:700;font-size:12px;text-decoration:none;border:1px solid #e3a928}
.by:hover{filter:brightness(1.05)}
.by svg{width:13px;height:13px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--blue);background:var(--blue-xl)}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.by:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.dng{border-color:var(--bad-line);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ic{padding:7px 10px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
select.btn{padding-right:8px}
.main{flex:1;display:flex;min-height:0}
nav.nav{width:218px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 11px;margin-bottom:3px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--blue-xl)}
.nav button.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.nav svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:0 7px;font-weight:600}
.nav hr{border:0;border-top:1px solid var(--line2);margin:10px 4px}
.nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:6px 11px}
.content{flex:1;overflow:auto;padding:18px 22px 30px}
.wrap{max-width:980px;margin:0 auto}
h2{margin:2px 0 4px;font-size:21px}
.lead{color:var(--muted);margin:0 0 14px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:10px;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:1px solid var(--line2)}
.card>.hd h3{margin:0;font-size:15px}
.card>.hd .d{color:var(--muted);font-size:12.5px}
.card>.hd .tg{cursor:pointer;flex:1;min-width:0}
.card>.hd input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.card>.bd{padding:6px 14px 12px}
.card.col>.bd{display:none}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;transition:.15s;flex:0 0 auto;cursor:pointer}
.card.col .chev{transform:rotate(-90deg)}
.badge{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--blue-l);color:var(--blue-d);white-space:nowrap}
.badge.w{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line2)}
.row:last-child{border-bottom:0}
.row.dis{opacity:.5}
.row input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--blue);flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row label{cursor:pointer;display:block}
.row .s{display:block;color:var(--muted);font-size:12px;font-family:Consolas,monospace;word-break:break-all}
.row .r{display:block;font-size:12px;color:var(--warn);margin-top:1px}
.row.risk label::before{content:"⚠ ";color:var(--warn)}
.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:10px 4px 2px}
.note{background:var(--blue-xl);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:8px 0;color:var(--muted);font-size:13px}
.note.w{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note.b{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding:8px 2px}
@media(max-width:900px){.fgrid{grid-template-columns:1fr}nav.nav{width:170px}}
.f label.k{display:block;font-weight:600;margin-bottom:3px}
.f .h{color:var(--muted);font-size:12px;margin-top:3px}
.f input[type=text],.f input[type=password],.f input[type=number],.f select,.f textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.f textarea{font-family:Consolas,monospace;font-size:12.5px;min-height:150px;resize:vertical}
.f.full{grid-column:1/-1}
.f .pw{display:flex;gap:6px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 2px}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--blue)}
.chk .h{color:var(--muted);font-size:12px;display:block}
.chk.danger label{color:var(--bad);font-weight:600}
footer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{background:var(--blue-l);color:var(--blue-d);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip.w{background:var(--warn-bg);color:var(--warn);cursor:pointer}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal.on{display:flex}
.box{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.box.sm{width:min(520px,100%)}
.box .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--blue-xl)}
.box .mh h3{margin:0;flex:1}
.box .mb{padding:14px 16px;overflow:auto;flex:1}
.box .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.box pre{margin:0;font:12px/1.4 Consolas,monospace;white-space:pre;overflow:auto;background:#0f2238;color:#d8e8fb;padding:12px;border-radius:8px;max-height:62vh}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:80vw;box-shadow:0 8px 30px rgba(0,0,0,.3);border:1px solid #3d6490}
.toast.on{display:flex;gap:12px;align-items:center}
.toast.err{background:#b53030;border-color:#d96a6a}
.toast a{color:#a9d4ff;cursor:pointer;text-decoration:underline}
ul.w{margin:6px 0 0 18px;padding:0}
.hide{display:none!important}
.menu{position:relative}
.menu>.dd{position:absolute;right:0;top:110%;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:250px;display:none;z-index:5;padding:5px}
.menu.on>.dd{display:block}
.dd button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer}
.dd button:hover{background:var(--blue-l)}
.dd small{display:block;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cb2ff"/><stop offset="1" stop-color="#1658ba"/></linearGradient></defs>
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="url(#g)"/>
      <path d="M10 7h18l9 9v26H10z" fill="#fff"/><path d="M28 7l9 9H28z" fill="#c4defc"/>
      <path d="M17.5 21.5 14 26l3.5 4.5M26.5 21.5 30 26l-3.5 4.5" stroke="#2b7de9" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <div>
      <b data-i="Gerador de Autounattend">Gerador de Autounattend</b>

  <div class="sp"></div>
  <select id="preset" class="btn" data-iaria="Perfis rápidos">
    <option value="" data-i="Perfis rápidos…">Perfis rápidos…</option>
    <option value="full" data-i="Completo (igual ao arquivo original)">Completo (igual ao arquivo original)</option>
    <option value="safe" data-i="Conservador (mantém Edge, Store, UAC…)">Conservador (mantém Edge, Store, UAC…)</option>
    <option value="setup" data-i="Somente instalação (sem ajustes)">Somente instalação (sem ajustes)</option>
  </select>
  <div class="menu" id="pmenu">
    <button class="btn" id="pbtn"><span data-i="Perfil">Perfil</span> ▾</button>
    <div class="dd">
      <button id="psave"><span data-i="Salvar configuração…">Salvar configuração…</span><small data-i="Grava um arquivo .json com suas escolhas">Grava um arquivo .json com suas escolhas</small></button>
      <button id="pload"><span data-i="Abrir configuração…">Abrir configuração…</span><small data-i="Carrega um .json salvo antes">Carrega um .json salvo antes</small></button>
    </div>
  </div>
  <select id="lang" class="btn" data-iaria="Idioma" title="Idioma / Language / Idioma">
    <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option>
  </select>
  <button class="btn ic" id="theme" data-iaria="Alternar modo claro/escuro" data-ititle="Alternar modo claro/escuro"></button>
  <button class="btn" id="quit" data-ititle="Fechar o programa" data-i="Sair">Sair</button>
</header>
<div class="main">
  <nav class="nav" id="nav"></nav>
  <div class="content" id="content"><div class="wrap" id="wrap">…</div></div>
</div>
<footer>
  <span class="chip" id="st1">—</span>
  <span class="chip" id="st2">—</span>
  <span class="chip w hide" id="stw"></span>
  <span class="sp"></span>
  <button class="btn" id="bprev" data-i="Visualizar XML">Visualizar XML</button>
  <button class="btn" id="bcopy" data-i="Copiar">Copiar</button>
  <button class="btn pri" id="bsave" data-i="Gerar e salvar autounattend.xml">Gerar e salvar autounattend.xml</button>
</footer>

<div class="modal" id="mprev"><div class="box">
  <div class="mh"><h3 data-i="Pré-visualização do XML">Pré-visualização do XML</h3><span class="badge" id="pinfo"></span><button class="btn sm" id="pclose" data-i="Fechar">Fechar</button></div>
  <div class="mb"><pre id="pre"></pre></div>
  <div class="mf"><button class="btn" id="pcopy" data-i="Copiar">Copiar</button><button class="btn pri" id="psave2" data-i="Salvar como…">Salvar como…</button></div>
</div></div>

<div class="modal" id="mwarn"><div class="box sm">
  <div class="mh"><h3 data-i="Avisos antes de salvar">Avisos antes de salvar</h3></div>
  <div class="mb"><ul class="w" id="wlist"></ul>
  <p style="color:var(--muted);margin:12px 0 0" id="wtip"></p></div>
  <div class="mf"><button class="btn" id="wno" data-i="Voltar">Voltar</button><button class="btn pri" id="wyes" data-i="Salvar mesmo assim">Salvar mesmo assim</button></div>
</div></div>

<div class="modal" id="mwipe"><div class="box sm">
  <div class="mh"><h3 style="color:var(--bad)" data-i="⚠ Apagar disco automaticamente">⚠ Apagar disco automaticamente</h3></div>
  <div class="mb">
    <p id="wipetxt"></p>
    <p id="wipeask"></p>
    <input type="text" id="wipein" autocomplete="off" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">
  </div>
  <div class="mf"><button class="btn" id="wipeno" data-i="Cancelar">Cancelar</button><button class="btn dng" id="wipeyes" disabled data-i="Ativar">Ativar</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, a, ...k) => { const e = document.createElement(t); if (a) for (const [x, v] of Object.entries(a)) { if (x === "class") e.className = v; else if (x === "text") e.textContent = v; else if (x.startsWith("on")) e.addEventListener(x.slice(2), v); else if (v !== false && v != null) e.setAttribute(x, v === true ? "" : v); } for (const c of k.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };

async function api(path, body, keepalive) {
  const r = await fetch(path, { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body || {}), keepalive: !!keepalive });
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, ok: r.ok, data: j };
}

function groupItems(g) { return S.cat.items.filter(i => i.group === g.id && !i.removed).sort((a, b) => a.order - b.order); }
function tabOffCount(tab) {
  let n = 0;

}

    const autoDiv = el("div", { style: "border-top: 1px solid var(--line2); padding-top: 12px; margin-top: 6px;" });
    const idAuto = "f_autoLogon";
    const chkAuto = el("input", { type: "checkbox", id: idAuto, checked: !!o.autoLogon });
    chkAuto.addEventListener("change", () => {
      o.autoLogon = chkAuto.checked;
      syncLegacy();
      render(true);
    });
    autoDiv.append(el("div", { class: "chk" }, chkAuto, el("div", null, el("label", { for: idAuto, text: t("Entrar automaticamente no primeiro logon") }))));

    if (o.autoLogon) {
      const autoGrid = el("div", { class: "fgrid", style: "margin-top: 8px;" });

      const selUser = el("select", null);
      selUser.append(el("option", { value: "", text: t("Primeiro administrador (padrão)") }));
      o.userAccounts.forEach(acc => {
        if (acc.name) {
          selUser.append(el("option", { value: acc.name, text: acc.name + " (" + (acc.group === "Administrators" ? t("Administrador") : t("Usuário")) + ")" }));
        }
      });
      selUser.value = o.autoLogonUser || "";
      selUser.addEventListener("change", () => { o.autoLogonUser = selUser.value; syncLegacy(); });
      autoGrid.append(el("div", { class: "f" }, el("label", { class: "k", text: t("Conta para logon automático") }), selUser));

      const inpCount = el("input", { type: "number", min: 1, max: 999, value: o.autoLogonCount || 1 });
      inpCount.addEventListener("input", () => { o.autoLogonCount = parseInt(inpCount.value, 10) || 1; syncLegacy(); });
      autoGrid.append(el("div", { class: "f" }, el("label", { class: "k", text: t("Quantidade de logons automáticos") }), inpCount));

      autoDiv.append(autoGrid);
    }
    bd.append(autoDiv);
  }

  card.append(hd, bd);
  return card;
}

function renderFields(tab) {
  const w = $("#wrap");
  const T = S.cat.tabs.find(x => x.id === tab);
  w.append(el("h2", { text: loc(T, "title") }));
  const lead = { setup: "Como o instalador do Windows vai se comportar. Os valores iniciais reproduzem o arquivo original.", account: "Identificação do computador, idioma, fuso e conta de usuário.", adv: "Para quem quer acrescentar os próprios comandos ao arquivo gerado." }[tab];
  w.append(el("p", { class: "lead", text: t(lead) }));
  if (S.o.wipeDisk) w.append(el("div", { class: "note b", text: t("⚠ Apagar disco automaticamente está ATIVO: a instalação formatará o disco {n} sem perguntar.", { n: S.o.diskID }) }));
  for (const c of FIELDS[tab]) {
    if (c.custom === "users") {
      w.append(renderUsersCard(c));
      continue;
    }
    const bd = el("div", { class: "bd" });
    let grid = null;
    for (const f of c.f) {
      if (f.when && !f.when(S.o)) continue;
      const n = fieldNode(f);
      if (f.t === "bool") { grid = null; bd.append(n); }
      else { if (!grid) { grid = el("div", { class: "fgrid" }); bd.append(grid); } grid.append(n); }
    }
    w.append(el("div", { class: "card" }, el("div", { class: "hd" }, el("div", { class: "tg" }, el("h3", { text: t(c.title) }), c.desc ? el("div", { class: "d", text: t(c.desc) }) : null)), bd));
  }
}

function itemRow(it, dis) {
  const id = "i_" + it.id;
  const c = el("input", { type: "checkbox", id, checked: isOn(it.id) });
  c.addEventListener("change", () => { setItem(it.id, c.checked); regen(); refreshCounts(); });
  return el("div", { class: "row" + (it.risk ? " risk" : "") + (dis ? " dis" : ""), "data-id": it.id }, c,
    el("div", { class: "t" }, el("label", { for: id, text: loc(it, "label") }), it.sub ? el("span", { class: "s", text: it.sub }) : null, it.risk ? el("span", { class: "r", text: loc(it, "risk") }) : null));
}

function groupCard(g, items, forceOpen) {
  const all = groupItems(g);
  const dis = depOff(g);
  const open = forceOpen || (S.open[g.id] ?? all.length <= 8);
  const card = el("div", { class: "card" + (open ? "" : " col"), "data-g": g.id });
  const on = all.filter(i => isOn(i.id)).length;
  const m = el("input", { type: "checkbox", title: t("Marcar/desmarcar todos"), "aria-label": t("Marcar ou desmarcar todos de {n}", { n: loc(g, "title") }) });
  m.checked = on === all.length; m.indeterminate = on > 0 && on < all.length;
  m.addEventListener("change", () => { for (const i of all) setItem(i.id, m.checked); regen(); render(true); });
  const cv = document.createElementNS("http://www.w3.org/2000/svg", "svg"); cv.setAttribute("viewBox", "0 0 24 24"); cv.setAttribute("class", "chev"); cv.innerHTML = '<path d="m6 9 6 6 6-6"/>';
  const toggle = () => { S.open[g.id] = card.classList.contains("col"); card.classList.toggle("col"); };
  cv.addEventListener("click", toggle);
  const hd = el("div", { class: "hd" }, m, el("div", { class: "tg", onclick: toggle }, el("h3", { text: loc(g, "title") }), el("div", { class: "d", text: loc(g, "desc") })), el("span", { class: "badge" + (on < all.length ? " w" : ""), "data-cnt": g.id, text: on + "/" + all.length }), cv);
  const bd = el("div", { class: "bd" });
  if (dis) bd.append(el("div", { class: "note w", text: t("Estes itens não terão efeito porque o item \"{n}\" está desligado.", { n: loc(S.byId[DEP[g.id]], "label") }) }));
  const scopes = new Set(items.map(i => i.scope));
  for (const sc of ["sys", "usr"]) {
    const list = items.filter(i => i.scope === sc);
    if (!list.length) continue;
    if (scopes.size > 1) bd.append(el("div", { class: "sub", text: sc === "sys" ? t("Sistema (todos os usuários — HKLM)") : t("Usuário (primeiro logon — HKCU)") }));
    for (const it of list) bd.append(itemRow(it, dis));
  }
  card.append(hd, bd);
  return card;
}

function refreshCounts() {
  for (const g of S.cat.groups) {
    const all = groupItems(g), on = all.filter(i => isOn(i.id)).length;
    const b = $('[data-cnt="' + g.id + '"]'); if (b) { b.textContent = on + "/" + all.length; b.className = "badge" + (on < all.length ? " w" : ""); }
    const m = b && b.parentNode.querySelector("input[type=checkbox]"); if (m) { m.checked = on === all.length; m.indeterminate = on > 0 && on < all.length; }
  }
  renderNav();
  const need = [...document.querySelectorAll("[data-g]")].some(c => { const g = S.cat.groups.find(x => x.id === c.dataset.g); return !!c.querySelector(".note.w") !== !!depOff(g); });
  if (need) render(true);
}

function renderItems(tabs) {
  const w = $("#wrap");
  const q = S.q.trim().toLowerCase();
  if (q) w.append(el("h2", { text: t("Resultados da busca") }));
  else {
    const T = S.cat.tabs.find(x => x.id === tabs[0]); w.append(el("h2", { text: loc(T, "title") }));
    const lead = { apps: "O que será removido do Windows durante a instalação.", power: "Plano de energia personalizado para desempenho.", perf: "Ajustes de desempenho, serviços e tarefas agendadas.", priv: "Telemetria, privacidade, segurança e atualizações.", ui: "Aparência do Explorador, Menu Iniciar e barra de tarefas.", user: "Ajustes aplicados ao perfil do usuário no primeiro logon." }[tabs[0]];
    w.append(el("p", { class: "lead", text: t(lead) + " " + t("Marcado = será aplicado. Desmarque o que você NÃO quer aplicar.") }));
  }
  if (!S.o.runScript) w.append(el("div", { class: "note w", text: t("O script de ajustes está desligado na aba Instalação — nada desta página será aplicado.") }));
  const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg"); sv.setAttribute("viewBox", "0 0 24 24"); sv.innerHTML = '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>';
  const qi = el("input", { type: "search", id: "q", placeholder: t("Buscar em todos os ajustes (ex.: telemetria, Xbox, OneDrive, UAC…)"), value: S.q, "aria-label": t("Buscar ajustes") });
  qi.addEventListener("input", () => { S.q = qi.value; const p = qi.selectionStart; render(true); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); });
  w.append(el("div", { class: "search" }, sv, qi));
  let shown = 0;
  for (const g of S.cat.groups) {
    if (!q && !tabs.includes(g.tab)) continue;
    if (q && !ITEM_TABS.includes(g.tab)) continue;
    let items = groupItems(g);
    if (q) items = items.filter(i => (loc(i, "label") + " " + i.label + " " + (i.sub || "") + " " + (loc(i, "risk") || "") + " " + loc(g, "title")).toLowerCase().includes(q));
    if (!items.length) continue;
    shown++;
    w.append(groupCard(g, items, !!q));
  }
  if (!shown) w.append(el("div", { class: "note", text: t("Nada encontrado.") }));
}

// ------------------------------------------------------------ aba Pós-instalação (winget & chocolatey)
function postBool(k, label, hint) {
  const id = "p_" + k, c = el("input", { type: "checkbox", id, checked: !!S.o[k] });
  c.addEventListener("change", () => { S.o[k] = c.checked; regen(); render(true); });
  return el("div", { class: "chk" }, c, el("div", null, el("label", { for: id, text: t(label) }), hint ? el("span", { class: "h", text: t(hint) }) : null));
}

function renderPost() {
  const w = $("#wrap"), o = S.o;
  const T = S.cat.tabs.find(x => x.id === "post");
  w.append(el("h2", { text: loc(T, "title") }), el("p", { class: "lead", text: t("Cria na área de trabalho o arquivo Pos-instalacao.bat para instalação automática de programas via Winget e Chocolatey (precisa de internet).") }));

  const bd = el("div", { class: "bd" });
  bd.append(postBool("postEnabled", "Criar o script de pós-instalação na área de trabalho", "Fica na área de trabalho de todos os usuários (C:\\Users\\Public\\Desktop)."));
  bd.append(postBool("postAutoRun", "Executar o script sozinho no primeiro logon", "O script roda automaticamente no primeiro logon do usuário."));
  bd.append(postBool("postDelete", "Apagar o script da área de trabalho quando tudo for instalado"));
  bd.append(el("div", { class: "note", text: t("Precisa de internet. Os programas selecionados serão instalados silenciosamente.") }));
  w.append(el("div", { class: "card" }, el("div", { class: "hd" }, el("div", { class: "tg" }, el("h3", { text: t("Configurações do script" ) }))), bd));

  // Card WINGET
  const taWinget = el("textarea", { id: "p_winget", placeholder: "Google.Chrome\n7zip.7zip\nVideoLAN.VLC\nNotepad++.Notepad++\n# Digite um ID por linha", spellcheck: "false", style: "min-height: 140px;" });
  taWinget.value = o.postWingetCustom !== undefined ? o.postWingetCustom : (o.postCustom || "");
  taWinget.addEventListener("input", () => {
    o.postWingetCustom = taWinget.value;
    o.postCustom = taWinget.value;
    regen();
  });

  const cardWinget = el("div", { class: "card" },
    el("div", { class: "hd" },
      el("div", { class: "tg" },
        el("h3", { text: "Winget" }),
        el("div", { class: "d", text: t("Adicione aqui sua lista para instalação via WINGET") })
      )
    ),
    el("div", { class: "bd" },
      el("div", { class: "fgrid" },
        el("div", { class: "f full" },
          el("label", { class: "k", for: "p_winget", text: t("IDs do winget, um por linha (use # para comentários)") }),
          taWinget,
          el("div", { class: "h", text: t("Para achar o ID de um programa, abra o Terminal e digite: winget search nome-do-programa") })
        )
      )
    )
  );
  w.append(cardWinget);

  // Card CHOCOLATEY
  const taChoco = el("textarea", { id: "p_choco", placeholder: "googlechrome\n7zip\nvlc\nnotepadplusplus\n# Digite um pacote por linha", spellcheck: "false", style: "min-height: 140px;" });
  taChoco.value = o.postChocoCustom || "";
  taChoco.addEventListener("input", () => {
    o.postChocoCustom = taChoco.value;
    regen();
  });

  const bdChoco = el("div", { class: "bd" });
  bdChoco.append(postBool("postChocoEnabled", "Instalar o Chocolatey", "Instala o gerenciador de pacotes Chocolatey automaticamente na máquina."));
  bdChoco.append(el("div", { class: "fgrid", style: "margin-top: 12px;" },
    el("div", { class: "f full" },
      el("label", { class: "k", for: "p_choco", text: t("Pacotes do Chocolatey, um por linha (use # para comentários)") }),
      taChoco,
      el("div", { class: "h", text: t("Exemplos: googlechrome, 7zip, vlc, git, vscode, python. Consulte: community.chocolatey.org/packages") })
    )
  ));

  const cardChoco = el("div", { class: "card" },
    el("div", { class: "hd" },
      el("div", { class: "tg" },
        el("h3", { text: "Chocolatey" }),

      )
    ),
    bdChoco
  );
  w.append(cardChoco);
}

function render(keepScroll) {
  const sc = $("#content").scrollTop;
  $("#wrap").textContent = "";
  renderNav();
  if (S.q) renderItems(ITEM_TABS);
  else if (S.tab === "post") renderPost();
  else if (FIELDS[S.tab]) renderFields(S.tab);
  else renderItems([S.tab]);
  if (keepScroll) $("#content").scrollTop = sc;
}

// ------------------------------------------------------------ geração
let gT = 0, gSeq = 0;
function regen() { clearTimeout(gT); gT = setTimeout(doGen, 350); }
async function doGen() {
  const seq = ++gSeq;
  const r = await api("/api/generate", Object.assign({}, S.o, { lang: LANG === "pt" ? "pt-BR" : LANG }));
  if (seq !== gSeq) return null;
  const st1 = $("#st1"), st2 = $("#st2"), stw = $("#stw");
  if (!r.ok) {
    S.res = null; st1.textContent = t("Erro"); st1.className = "chip bad"; st2.textContent = (r.data && r.data.error) || t("Falha ao gerar");
    stw.classList.add("hide"); return null;
  }
  S.res = r.data;
  const s = r.data.stats;
  st1.className = "chip"; st1.textContent = s.hasScript ? t("{a} de {b} ajustes ativos", { a: s.itemsOn, b: s.itemsTotal }) : t("Sem script de ajustes");
  st2.textContent = (s.bytes / 1024).toFixed(0) + " KB" + (s.hasScript ? " · " + t("{n} linhas de script", { n: s.scriptLines }) : "");
  const W = r.data.warnings || []; r.data.warnings = W;
  if (W.length) { stw.classList.remove("hide"); stw.textContent = t(W.length > 1 ? "⚠ {n} avisos" : "⚠ {n} aviso", { n: W.length }); } else stw.classList.add("hide");
  return r.data;
}

function toast(msg, err, action) {
  const tt = $("#toast"); tt.textContent = ""; tt.className = "toast on" + (err ? " err" : "");
  tt.append(msg); if (action) tt.append(el("a", { text: action.text, onclick: action.fn }));
  clearTimeout(toast.t); toast.t = setTimeout(() => tt.classList.remove("on"), err ? 9000 : 7000);
}

function blobDownload(name, text, mime) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: mime || "application/octet-stream" })), download: name });
  document.body.append(a); a.click(); a.remove();
}

async function saveFile(kind, name, content) {
  const r = await api("/api/save", { kind, name, content });
  if (r.status === 501) { blobDownload(name, content, kind === "xml" ? "application/xml" : "application/json"); toast(t("Arquivo enviado para a pasta de downloads do navegador.")); return; }
  if (!r.ok) { toast((r.data && r.data.error) || t("Falha ao salvar"), true); return; }
  if (r.data.cancelled) return;
  toast(t("Salvo em {p}", { p: r.data.path }) + "  ", false, { text: t("Mostrar na pasta"), fn: () => api("/api/reveal", { path: r.data.path }) });
}

async function generateNow() {
  clearTimeout(gT);
  const d = await doGen();
  if (!d) { toast($("#st2").textContent || t("Não foi possível gerar o XML"), true); return null; }
  return d;
}

function showWarnings(list, confirm) {
  const ul = $("#wlist"); ul.textContent = ""; list.forEach(x => ul.append(el("li", { text: x })));
  const m = $("#mwarn"); m.classList.add("on");
  $("#wyes").classList.toggle("hide", !confirm);
  $("#wno").textContent = confirm ? t("Voltar") : t("Fechar");
  return new Promise(res => { $("#wyes").onclick = () => { m.classList.remove("on"); res(true); }; $("#wno").onclick = () => { m.classList.remove("on"); res(false); }; });
}

async function saveXML() {
  if (S.saving) return; S.saving = true;
  try {
    const d = await generateNow(); if (!d) return;
    if (d.warnings.length && !(await showWarnings(d.warnings, true))) return;
    await saveFile("xml", "autounattend.xml", d.xml);
  } finally { S.saving = false; }
}

async function copyText(tx) {
  try { await navigator.clipboard.writeText(tx); return true; } catch (e) {}
  const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = tx; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok;
}

function askWipe(done) {
  const m = $("#mwipe"), i = $("#wipein"), y = $("#wipeyes");
  i.value = ""; y.disabled = true; m.classList.add("on"); i.focus();
  i.oninput = () => { y.disabled = i.value.trim().toUpperCase() !== t("APAGAR"); };
  $("#wipeno").onclick = () => { m.classList.remove("on"); render(true); };
  y.onclick = () => { m.classList.remove("on"); done(); };
}

// ------------------------------------------------------------ perfis
function cleanProfile() { const o = JSON.parse(JSON.stringify(S.o)); const it = {}; for (const [k, v] of Object.entries(o.items || {})) if (v === false && S.byId[k]) it[k] = false; o.items = it; delete o.lang; return o; }
function applyProfile(p) {
  const o = JSON.parse(JSON.stringify(S.def));
  for (const k of Object.keys(o)) if (k !== "items" && k in p && typeof p[k] === typeof o[k]) o[k] = p[k];
  o.items = {}; if (p.items && typeof p.items === "object") for (const [k, v] of Object.entries(p.items)) if (v === false && S.byId[k]) o.items[k] = false;
  S.o = o; render(); regen();
}
function preset(n) {
  const o = S.o;
  if (n === "full") { o.items = {}; o.runScript = true; }
  else if (n === "safe") { o.runScript = true; o.items = {}; for (const id of S.cat.presets.conservador.off) if (S.byId[id]) o.items[id] = false; }
  else if (n === "setup") { o.runScript = false; }
  render(); regen();
}

function setLang(l) {
  LANG = l; store("ga.lang", l); applyStatic(); if (S.cat) { render(true); doGen(); }
}

// ------------------------------------------------------------ início
async function init() {
  const nl = (navigator.language || "pt").toLowerCase();
  LANG = load("ga.lang") || (nl.startsWith("es") ? "es" : nl.startsWith("en") ? "en" : "pt");
  if (!["pt", "en", "es"].includes(LANG)) LANG = "pt";
  THEME = load("ga.theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(); applyStatic();

  const r = await api("/api/init");
  if (!r.ok) { $("#wrap").textContent = t("Não foi possível iniciar a interface."); return; }
  const d = r.data;
  S.cat = d.catalog; S.def = d.defaults; S.o = JSON.parse(JSON.stringify(d.defaults)); S.o.items = S.o.items || {};
  S.locales = d.locales; S.tz = d.timezones; S.winget = d.winget || [];
  for (const i of S.cat.items) S.byId[i.id] = i;
  const verEl = $("#ver"); if (verEl) verEl.textContent = "v" + d.version;
  render(); doGen();

  setInterval(() => api("/api/ping"), 3000);
  addEventListener("pagehide", () => { api("/api/bye", {}, true); });
  $("#lang").addEventListener("change", e => setLang(e.target.value));
  $("#theme").addEventListener("click", () => { THEME = THEME === "dark" ? "light" : "dark"; store("ga.theme", THEME); applyTheme(); });
  $("#preset").addEventListener("change", e => { const v = e.target.value; e.target.value = ""; if (v) preset(v); });
  $("#pbtn").addEventListener("click", e => { e.stopPropagation(); $("#pmenu").classList.toggle("on"); });
  document.addEventListener("click", () => $("#pmenu").classList.remove("on"));
  $("#psave").addEventListener("click", () => saveFile("profile", "perfil-autounattend.json", JSON.stringify(cleanProfile(), null, 2)));
  $("#pload").addEventListener("click", async () => {
    const r = await api("/api/open");
    if (r.status === 501) { const f = el("input", { type: "file", accept: ".json,application/json" }); f.onchange = async () => { if (f.files[0]) { try { applyProfile(JSON.parse(await f.files[0].text())); toast(t("Configuração carregada.")); } catch (e) { toast(t("Arquivo de perfil inválido."), true); } } }; f.click(); return; }
    if (!r.ok) { toast((r.data && r.data.error) || t("Falha ao abrir"), true); return; }
    if (r.data.cancelled) return;
    try { applyProfile(JSON.parse(r.data.content)); toast(t("Configuração carregada.")); } catch (e) { toast(t("Arquivo de perfil inválido."), true); }
  });
  $("#bsave").addEventListener("click", saveXML);
  $("#psave2").addEventListener("click", () => { $("#mprev").classList.remove("on"); saveXML(); });
  $("#bcopy").addEventListener("click", async () => { const d = await generateNow(); if (d) toast((await copyText(d.xml)) ? t("XML copiado para a área de transferência.") : t("Não foi possível copiar.")); });
  $("#pcopy").addEventListener("click", async () => { if (S.res) toast((await copyText(S.res.xml)) ? t("XML copiado.") : t("Não foi possível copiar.")); });
  $("#bprev").addEventListener("click", async () => { const d = await generateNow(); if (!d) return; $("#pre").textContent = d.xml; $("#pinfo").textContent = (d.stats.bytes / 1024).toFixed(0) + " KB"; $("#mprev").classList.add("on"); });
  $("#pclose").addEventListener("click", () => $("#mprev").classList.remove("on"));
  $("#stw").addEventListener("click", () => { if (S.res) showWarnings(S.res.warnings, false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".modal.on").forEach(m => { if (m.id !== "mwipe") m.classList.remove("on"); }); });
  $("#quit").addEventListener("click", async () => {
    await api("/api/quit");
    document.body.innerHTML = '<div style="margin:20vh auto;text-align:center;font:18px Segoe UI,sans-serif;color:#16324f;background:#fff;padding:30px;border-radius:12px;max-width:520px"></div>';
    document.body.firstChild.textContent = t("Programa encerrado. Você já pode fechar esta janela.");
    document.body.style.overflow = "auto";
    setTimeout(() => window.close(), 300);
  });
}
init();
</script>
